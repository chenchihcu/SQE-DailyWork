name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  SQE_TEST_HANG_SECONDS: "180"

jobs:
  verify-full:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pyyaml

      - name: Run Full verify gate
        shell: pwsh
        run: |
          .\scripts\verify.ps1 -Profile Full -PythonExe (Get-Command python).Source -AllowSchemaOnlySource -SkipNativeVisual

      - name: Upload verification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-artifacts
          path: |
            scratch/
            logs/

  verify-coverage:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pyyaml

      - name: Run Coverage verify gate
        shell: pwsh
        run: |
          .\scripts\verify.ps1 -Profile Coverage -PythonExe (Get-Command python).Source -AllowSchemaOnlySource

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            scratch/coverage.xml
            scratch/coverage-html/
            scratch/coverage-summary.json

  verify-soak:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Soak verify gate
        shell: pwsh
        run: |
          .\scripts\verify.ps1 -Profile Soak -PythonExe (Get-Command python).Source -AllowSchemaOnlySource
